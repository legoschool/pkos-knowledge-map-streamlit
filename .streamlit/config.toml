# 레고학교 색감: 밝은 본문 + 우주 남색 사이드바, 레고 파랑·노랑·빨강 포인트
[theme]
base = "light"
primaryColor = "#2457D6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3FF"
textColor = "#18213F"
linkColor = "#2457D6"
borderColor = "#D9E2F7"
codeBackgroundColor = "#F2F5FC"
codeTextColor = "#18213F"
redColor = "#E3000B"
orangeColor = "#F27A00"
yellowColor = "#E0A800"
greenColor = "#1E9A55"
blueColor = "#2457D6"
violetColor = "#7A3FE0"
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
headingFont = "Do Hyeon:https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap"
baseFontSize = 16
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
headingFontSizes = ["40px", "30px", "24px", "20px", "17px", "15px"]
headingFontWeights = [400, 400, 400, 400, 400, 400]
paddingTop = "1.5rem"
paddingBottom = "3rem"
chartCategoricalColors = ["#2457D6", "#E3000B", "#F5B700", "#1E9A55", "#7A3FE0", "#F27A00", "#0097A7", "#5B6B8C"]

[theme.sidebar]
backgroundColor = "#101A3D"
secondaryBackgroundColor = "#1C2A5E"
textColor = "#EEF2FF"
borderColor = "#2E3F7A"
primaryColor = "#E3000B"
linkColor = "#FFD866"
codeBackgroundColor = "#1C2A5E"
codeTextColor = "#EEF2FF"

[server]
enableStaticServing = true
maxUploadSize = 20
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false
